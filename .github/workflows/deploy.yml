name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Workers
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Purge zone cache (best-effort)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ZONE_ID=$(curl -s -m 20 "https://api.cloudflare.com/client/v4/zones?name=aihcn.com" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            | python3 -c "import json,sys;d=json.load(sys.stdin);print(d['result'][0]['id'] if d.get('success') and d.get('result') else '')")
          if [ -z "$ZONE_ID" ]; then
            echo "⚠️ 未能解析 aihcn.com zone id（Token 可能缺少 Zone 读取权限），请手动在 Dashboard 执行 Purge Everything"
            exit 0
          fi
          curl -s -m 20 -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
            | python3 -c "import json,sys;d=json.load(sys.stdin);print('✅ 已清除 aihcn.com zone 缓存' if d.get('success') else '⚠️ Purge 失败：'+json.dumps(d.get('errors')))"

      - name: Deployment Status
        run: |
          echo "🎉 部署成功！"
          echo "🌐 访问地址: https://aihcn.com"
          echo "📢 临时域名: https://aihcn-website.410291479.workers.dev"
          echo ""
          echo "📊 网站信息:"
          echo "   - 页面数量: $(find build -name '*.html' | wc -l | tr -d ' ')"
          echo "   - 主页存在: $([ -f build/index.html ] && echo '✅' || echo '❌')"
          echo "   - 404兜底页: $([ -f build/404.html ] && echo '✅' || echo '❌')"
          echo "   - API接口: $(grep -c "path === '/api/" worker.js | tr -d ' ') 个"
