name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Workers
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Deployment Status
        run: |
          echo "🎉 部署成功！"
          echo "🌐 访问地址: https://aihcn.com"
          echo "📢 临时域名: https://aihcn-website.410291479.workers.dev"
          echo ""
          echo "📊 网站信息:"
          echo "   - 页面数量: $(find build -name '*.html' | wc -l | tr -d ' ')"
          echo "   - 主页存在: $([ -f build/index.html ] && echo '✅' || echo '❌')"
          echo "   - 404兜底页: $([ -f build/404.html ] && echo '✅' || echo '❌')"
          echo "   - API接口: $(grep -c "path === '/api/" worker.js | tr -d ' ') 个"
