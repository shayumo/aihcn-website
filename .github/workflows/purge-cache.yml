name: Purge aihcn.com Cache

on:
  workflow_dispatch:

jobs:
  purge:
    runs-on: ubuntu-latest
    name: Purge zone cache
    steps:
      - name: Purge Everything
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ZONE_ID=$(curl -s -m 20 "https://api.cloudflare.com/client/v4/zones?name=aihcn.com" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            | python3 -c "import json,sys;d=json.load(sys.stdin);print(d['result'][0]['id'] if d.get('success') and d.get('result') else '')")
          if [ -z "$ZONE_ID" ]; then
            echo "❌ 无法解析 aihcn.com zone id：Token 需要 Zone 读取权限；也可在 Dashboard → aihcn.com → Caching → Configuration → Purge Everything 手动清理"
            exit 1
          fi
          RESP=$(curl -s -m 20 -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          echo "$RESP" | python3 -c "import json,sys;d=json.load(sys.stdin);print('✅ Purge Everything 成功，旧缓存已清除' if d.get('success') else '❌ Purge 失败：'+json.dumps(d.get('errors')))"
          echo "$RESP" | python3 -c "import json,sys;d=json.load(sys.stdin);sys.exit(0 if d.get('success') else 1)"
